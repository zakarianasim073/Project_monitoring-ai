name: NodeJS with Webpack

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Build Backend
      run: |
        cd backend
        npm install
        npm run build

    - name: Build Frontend
      run: |
        cd frontend
        # Pin pnpm to v9 to avoid ERR_PNPM_IGNORED_BUILDS on Node 22+ (pnpm v10+)
        npm install -g pnpm@9
        pnpm install
        pnpm run build
